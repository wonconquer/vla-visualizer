<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:Arial,'Noto Sans KR',sans-serif;color:#1c3048;background:transparent}body{margin:0}svg.pipeline{width:100%;display:block}.node{cursor:pointer;outline:none}.node>rect{fill:#fff;stroke:#9eafc3;stroke-width:1.5}.node:hover>rect,.node:focus>rect{stroke:#404fba;stroke-width:2.8}.node.active>rect{fill:#e9edff;stroke:#3d4fc0;stroke-width:3}.node.trainable>rect{stroke:#b96a16;fill:#fff5e7}.edge{fill:none;stroke:#9aaec3;stroke-width:2;marker-end:url(#arrow)}.edge.context{stroke:#557eaf;stroke-dasharray:5 3}.edge.active{stroke:#4a4ac7;stroke-width:3.5;marker-end:url(#arrowActive)}.edge.flowing{stroke-dasharray:10 6;animation:flow .9s linear infinite}.label{font-size:15px;font-weight:650;fill:#1e354d}.data{font-size:13px;fill:#3b546c}.tiny{font-size:12px;fill:#4b6077}.glyph{cursor:crosshair;outline:none}.glyph:focus{stroke:#e06c1c;stroke-width:3}.group{font-size:13px;font-weight:bold;fill:#375474}.hint{font-size:13px;color:#4b6077;margin:5px 8px}.badge{fill:#88520e;font-size:11px}#inspector{display:none;border:2px solid #6976c5;border-radius:12px;padding:14px;margin:8px;background:#fff;box-sizing:border-box}#inspector h3{margin:0 0 8px;font-size:16px}.inspect-columns{display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1.2fr);gap:18px}.norm-grid{display:grid;gap:1px;max-width:310px;margin:8px 0}.cell{aspect-ratio:1;min-width:0;outline:none}.cell.selected,.cell:focus{outline:2px solid #f36a16;z-index:2}.meta{font:12px monospace;overflow-wrap:anywhere;line-height:1.6;color:#334b65}button,input{font:inherit;padding:5px 8px;margin:4px;border:1px solid #91a2b9;border-radius:5px}img{max-width:100%}.channels{display:flex;align-items:center;height:90px;gap:3px;border-top:1px solid #9baabc;border-bottom:1px solid #9baabc}.channel{flex:1;min-width:3px;background:#6876be}.negative{background:#bd7b50}.call-state{font-size:13px;fill:#263e61}@keyframes flow{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){.edge.flowing{animation:none}}@media(max-width:650px){.inspect-columns{grid-template-columns:1fr}}
#hover-preview{position:fixed;display:none;z-index:20;pointer-events:none;width:290px;max-width:calc(100vw - 16px);max-height:210px;overflow:auto;padding:12px;background:#fff;border:2px solid #6474bc;border-radius:10px;box-shadow:0 4px 18px #21345133;font-size:12px;color:#243b55;box-sizing:border-box}#hover-preview .preview-grid{display:grid;gap:0;width:100px;float:left;margin-right:10px}#hover-preview .preview-grid i{aspect-ratio:1}#hover-preview p{margin:4px 0}.hint{overflow-wrap:anywhere}#inspector{max-width:100%;overflow-wrap:anywhere}
</style><div id="hover-preview" role="tooltip" aria-live="polite"></div><div id="diagram"></div><p class="hint">Hover or focus a glyph for a compact measured preview. Click or press Enter to pin details. Each preview glyph is one recorded index (first 18 at most). Moving edges explain data flow, not measured neuron activity.</p><section id="inspector" aria-live="polite"></section>
<script>
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=null,hover=null,pinned=false,anchor={left:20,top:20,bottom:40};
const nodes=[
['top','top_vision',18,55,138,94,'Top observation','Recorded RGB','image_top'],['vision_top','top_vision',192,55,152,94,'Vision encoder','Shared weights','vision_top'],['connector_top','top_connector',382,55,154,94,'Connector','visual tokens','connector_top'],
['wrist','wrist_vision',18,195,138,94,'Wrist image','Recorded RGB','image_wrist'],['vision_wrist','wrist_vision',192,195,152,94,'Vision encoder','Shared weights','vision_wrist'],['connector_wrist','wrist_connector',382,195,154,94,'Connector','visual tokens','connector_wrist'],
['instruction','language_tokens',18,335,138,94,'Instruction','Instruction above','instruction'],['tokenizer','language_tokens',192,335,152,94,'Tokenizer','token IDs + mask','tokens'],['language','language_embedding',382,335,154,94,'Language embed','Token vectors','language'],
['state','state_normalize',18,475,138,94,'Robot state','Measured joints','state'],['normalize','state_normalize',192,475,152,94,'Normalize / pad','Normalize · zero pad','normalize'],['projection','state_project',382,475,154,94,'State projection','One state token','projection'],
['prefix','prefix',590,190,166,100,'Prefix composition','First-layer input','prefix'],['vlm','vlm_context',590,355,166,100,'VLM prefix pass','Final norm measurement','vlm_context'],
['noise','initial_noise',790,45,154,70,'Initial noise','Once per inference','initial_noise'],['cache','vlm_context',790,190,154,80,'Cached context','KV metadata only','cache'],
['state_x','action_state',790,355,154,90,'Current xₜ','Internal action sample','action_state'],['condition','conditioning',990,355,154,90,'Action / time MLP','projection + sin/cos t','conditioning'],
['expert','expert',990,190,154,90,'Action expert','Cached-prefix conditioning','expert'],['velocity','velocity',1190,190,154,90,'Output projection','Predicted flow vₜ','velocity'],
['solver','solver_update',1190,355,154,90,'Euler update','x ← x + (−1/N) vₜ','solver_update'],['next','loop_next',1190,515,154,85,'Next iteration','Updated x · k+1','next'],
['time','time_embedding',990,515,154,85,'Flow time t','native schedule · 1 → 0','time_embedding'],['actions','actions',1190,680,192,90,'Final action chunk','slice → inverse normalize','actions']];
const edges=[
['top_encoder','top_vision','M156 102H192'],['top_connector','top_connector','M344 102H382'],['wrist_encoder','wrist_vision','M156 242H192'],['wrist_connector','wrist_connector','M344 242H382'],
['top_prefix','prefix','M536 102H560Q575 102 575 120V211H590'],['wrist_prefix','prefix','M536 242H590'],['tokenize','language_tokens','M156 382H192'],['embed_language','language_embedding','M344 382H382'],['language_prefix','prefix','M536 382H560Q575 382 575 367V270H590'],
['normalize','state_normalize','M156 522H192'],['project','state_project','M344 522H382'],['state_prefix','prefix','M536 522H580Q585 522 585 505V286H620'],['vlm_process','vlm_context','M673 290V355'],['cache_fill','vlm_context','M756 405H766V300H867V270'],
['context_expert','expert','M944 230H990'],['noise_state','initial_noise','M790 80H780V318H867V355'],['state_condition','conditioning','M944 400H990'],['time_condition','conditioning','M1067 515V445'],['condition_expert','expert','M1067 355V280'],['expert_velocity','velocity','M1144 235H1190'],['velocity_solver','solver_update','M1267 280V355'],['solver_next','loop_next','M1267 445V515'],['next_state','loop_next','M1267 600V635H867V445'],['schedule_next','loop_next','M1190 557H1144'],['final_exit','actions','M1344 560H1410V710H1382']];
function size(){send('streamlit:setFrameHeight',{height:Math.ceil(document.body.getBoundingClientRect().height)+4});}
function pinEvent(){ /* Pinned hover is frontend-only; no Streamlit rerun. */ }
function inspect(key,index,args,event){anchor=event?.target?.getBoundingClientRect()??anchor;if(pinned)return;let item=args.visuals?.[key];if(!item?.mapping)return;hover={key,index,args,item};showPreview();}
function showPreview(){
 if(!hover)return;const {item,index,key}=hover,m=item.mapping,values=item.norms??[],lo=values.length?Math.min(...values):0,hi=values.length?Math.max(...values):1;
 let html=`<b>Measured representation · ${esc(key)}</b><p>Index ${item.token_indices?.[index]??index} · ${esc(m.camera??m.modality??m.stage)}<br>Shape ${esc(JSON.stringify(m.shape??item.features?.shape??[]))}<br>Norm ${values[index]===undefined?'Not recorded':values[index].toFixed(5)}</p>`;
 if(item.grid){html+=`<div class="preview-grid" style="grid-template-columns:repeat(${item.grid[1]},1fr)">`;values.forEach((v,i)=>{html+=`<i style="background:${i===index?'#ed721a':`hsl(225,58%,${88-(v-lo)/(hi-lo||1)*45}%)`}"></i>`});html+='</div>';}
 const lang=item.language_tokens?.[index];if(lang)html+=`<p>${esc(lang.token)} · ID ${lang.token_id}<br>${lang.valid?'Valid':'Masked padding'}</p>`;
 html+=`<p>Run ${esc(m.run_id?.slice(0,12))}<br>Record ${esc(m.record_id)} · flow ${m.flow_iteration??'N/A'}</p><p>Contextual representation, not attention.<br>Click / Enter to pin full details.</p>`;
 const el=document.getElementById('hover-preview');el.innerHTML=html;el.style.display='block';
 let top=0,bottom=innerHeight;
 try{const frame=window.frameElement;if(frame){const r=frame.getBoundingClientRect();top=Math.max(0,-r.top);bottom=Math.min(innerHeight,parent.innerHeight-r.top);}}catch(error){if(error.name!=='SecurityError')throw error;}
 const h=el.getBoundingClientRect().height,w=el.getBoundingClientRect().width;
 el.style.left=Math.max(8,Math.min(anchor.left,innerWidth-w-8))+'px';
 el.style.top=Math.max(top+8,Math.min(anchor.bottom+8,bottom-h-8))+'px';
}
function showInspector(){document.getElementById('hover-preview').style.display='none';
 if(!hover)return;const {key,index,args,item}=hover,m=item.mapping,feature=item.features;
 const tokenIndex=item.token_indices?.[index]??index,lang=item.language_tokens?.[tokenIndex];
 let vector=item.full_vectors?.[tokenIndex]??feature?.values?.[tokenIndex],channelIds=feature?.channel_indices??(vector?vector.map((_,i)=>i):[]);
 let panel=document.getElementById('inspector');panel.style.display='block';
 let metadata=`<div class="meta">run ${esc(m.run_id)}<br>stage ${esc(m.stage)} · record ${esc(m.record_id)}<br>module ${esc(m.module)}<br>camera/modality ${esc(m.camera??m.modality??key)} · index ${tokenIndex} · iteration ${m.flow_iteration??'Not applicable'}<br>${esc(m.summary_method)}<br>dtype ${esc(m.dtype??feature?.dtype??'Not recorded')} · shape ${esc(JSON.stringify(m.shape??feature?.shape??[]))}</div>`;
 if(feature)metadata+=`<p class="meta">Channel measurement: ${esc(feature.record_id)}<br>${esc(feature.module)} · ${esc(feature.stage)}<br>Channels ${esc(JSON.stringify(feature.channel_indices))} of ${feature.original_dimension}</p>`;
 let html=`<h3>${pinned?'Pinned':'Hover'} · Internal representation at this stage</h3><button id="unpin">Unpin / close (Escape)</button><label>Capture row <input id="token-index" type="number" min="0" max="${Math.max((item.norms?.length||item.language_tokens?.length||item.coordinate_values?.length||item.full_vectors?.length||1)-1,0)}" value="${index}" style="width:75px"></label><div class="inspect-columns"><div>`;
 if(item.grid){let [h,w]=item.grid;html+=`<b>Full ${h}×${w} token-norm grid</b><div class="norm-grid" style="grid-template-columns:repeat(${w},1fr)">`;let lo=Math.min(...item.norms),hi=Math.max(...item.norms);
 item.norms.forEach((v,i)=>{let f=(v-lo)/(hi-lo||1);html+=`<span role="button" tabindex="0" data-grid-index="${i}" class="cell ${i===tokenIndex?'selected':''}" title="token ${i}, L2 ${v}" style="background:hsl(225,58%,${88-f*45}%)"></span>`});html+='</div><small>Measured L2 norms, not attention or saliency.</small>';
 let g=item.geometry, row=Math.floor(tokenIndex/w),col=tokenIndex%w;
 if(g){let [ih,iw]=g.resized_hw, [py,px]=g.padding_top_left, ch=ih+py,cw=iw+px,x=col*cw/w,y=row*ch/h,rw=cw/w,rh=ch/h;
 html+=`<p>grid [row ${row}, col ${col}] · canvas (${x},${y})–(${x+rw},${y+rh})<br>${y+rh<=py?'This geometric patch is padding.':'This geometric patch overlaps the scene.'}</p>`;
 if(item.input_image)html+=`<svg viewBox="0 0 ${cw} ${ch}" style="max-width:280px"><image href="${esc(item.input_image)}" width="${cw}" height="${ch}"/><rect x="${x}" y="${y}" width="${rw}" height="${rh}" stroke="#ff6c16" stroke-width="3" fill="none"/></svg><small>Actual module input, quantized to 8-bit for display</small>`;
 else html+='<p>Not recorded: resized/padded pixels are missing in this legacy capture. They are not reconstructed.</p>';
 if(item.raw_image)html+=`<img src="${esc(item.raw_image)}" style="max-width:220px" alt="Original observation from the same camera"><small>Original camera. The overlay maps geometry on the model canvas. Contextual tokens can depend on other patches; this is not their influence region or attention.</small>`;
 }}
 if(lang)html+=`<p>Recorded token <b>${esc(lang.token)}</b> · ID ${lang.token_id}<br>mask ${lang.valid?'valid':'masked padding'}</p>`;
 if(item.coordinate_values)html+=`<p>${item.coordinate_names?'Measured joint '+esc(item.coordinate_names[tokenIndex]):'padded state coordinate'}: ${item.coordinate_values[tokenIndex]}<br>This glyph is a coordinate, not a token.</p>`;
 html+='</div><div>'+metadata;
 if(vector){let max=Math.max(...vector.map(Math.abs))||1;html+=`<p>Measured ${vector.length} channels ${feature?' / original dimension '+feature.original_dimension:''}<br>${esc(feature?.summary_method??'Complete recorded small action vector')}</p><div class="channels">`;vector.forEach((v,i)=>html+=`<span title="channel ${channelIds[i]??i}: ${v}" class="channel ${v<0?'negative':''}" style="height:${Math.max(2,Math.abs(v)/max*83)}px"></span>`);html+='</div><small>Blue: positive; brown: negative. Height shows absolute channel value.</small><p class="meta">'+vector.map((v,i)=>`${channelIds[i]??i}:${v.toFixed(5)}`).join(' · ')+'</p>';}
 else html+='<p>Not recorded: channel values are unavailable. Embeddings are never reconstructed from norms.</p>';
 if(item.norms?.[index]!==undefined)html+=`<b>Measured vector L2 norm ${item.norms[index].toFixed(5)}</b>`;
 html+='</div></div>';panel.innerHTML=html;
 document.getElementById('unpin').onclick=()=>{pinned=false;hover=null;panel.style.display='none';size();};
 document.getElementById('token-index').onchange=e=>{hover.index=Math.max(0,Math.min(Number(e.target.value),Number(e.target.max)));pinned=true;showInspector();};
 panel.querySelectorAll('[data-grid-index]').forEach(el=>{const choose=()=>{hover.index=Number(el.dataset.gridIndex);showInspector()};el.onclick=()=>{choose();pinned=true;showInspector();pinEvent();};el.onmouseenter=()=>{if(hover.index!==Number(el.dataset.gridIndex))choose();};el.onfocus=()=>{el.style.outline='2px solid #f36a16'};el.onkeydown=e=>{if(e.key==='Enter'){choose();pinned=true;showInspector();}};});panel.querySelectorAll('img').forEach(img=>img.onload=size);size();
}
function draw(a){current=a;let active=a.stage??'top_vision',data=a.visuals??{},training=!!a.training,k=a.iteration??0,n=a.total_iterations??10;
 let svg=`<svg class="pipeline" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Input data paths and the closed native action generation loop" viewBox="0 0 1420 790"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#8c9eb5"/></marker><marker id="arrowActive" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#4a4ac7"/></marker></defs><rect x="1" y="1" width="1418" height="788" rx="14" fill="#f5f8fc" stroke="#cbd6e2"/><path id="loop-boundary" d="M982 172H1378Q1398 172 1398 192V638Q1398 658 1378 658H798Q778 658 778 638V344Q778 324 798 324H970V184Q970 172 982 172Z" fill="#eef2fa" stroke="#607795" stroke-width="2" stroke-dasharray="8 3"/><text class="group" x="18" y="28">Independent input paths · not a concurrency timeline</text><text class="group" x="984" y="153">Native generation loop · ${training?'Inference only':`k=${k}/${n-1} (${k+1}/${n})`}</text>`;
 edges.forEach(([id,stage,d])=>{if(id==='noise_state')svg+='<circle data-crossing="independent-paths" cx="780" cy="300" r="4" fill="#f5f8fc"><title>Independent paths cross without a junction</title></circle>';let on=stage===active;if(id==='final_exit')on=active==='actions'&&k===n-1;svg+=`<path data-edge="${id}" class="edge ${id==='context_expert'?'context':''} ${on?'active':''} ${on&&a.playing&&!a.backward?'flowing':''}" d="${d}"/>`;});
 svg+=`<g aria-label="Loop input and output ports"><circle cx="970" cy="230" r="4" fill="white" stroke="#607795"><title>Cached context input; reused each iteration</title></circle><circle cx="867" cy="324" r="4" fill="white" stroke="#607795"><title>Initial sample input</title></circle><circle cx="1398" cy="560" r="4" fill="white" stroke="#607795"><title>Final iteration exit</title></circle></g><text class="tiny" x="790" y="290">${training?'Joint training pass':'Cached once; reused'}</text><text class="tiny" x="990" y="626">Updated x → next input · t=1+k(−1/N)</text><text class="tiny" x="1155" y="670">Exit after the final update</text>`;
 nodes.forEach(([id,stage,x,y,w,h,label,desc,key])=>{let v=data[key]??{},isActive=stage===active;if(training&&id==='cache'){label='Prefix context';desc='No training KV cache';}if(training&&id==='vlm'){label='Joint VLM forward';desc='Prefix + action suffix';}let title=training&&['actions','solver','next'].includes(id)?'Inference-only path':v.shape??desc;svg+=`<g role="button" tabindex="0" data-stage="${stage}" aria-label="${esc(label+': '+title)}" class="node ${isActive?'active':''} ${training&&id==='velocity'?'trainable':''}" transform="translate(${x} ${y})"><rect rx="10" width="${w}" height="${h}"/><text class="label" x="10" y="22">${label}</text>`;
 if(v.image)svg+=`<image href="${esc(v.image)}" x="10" y="31" width="${w-20}" height="${h-38}" preserveAspectRatio="xMidYMid slice"/>`;
 else {svg+=`<text class="data" x="10" y="43">${esc(title)}</text>`;let values=v.norms?.length?v.norms:v.coordinate_values?.length?v.coordinate_values:v.language_tokens?.map(t=>t.token_id),max=values?.length?Math.max(...values.map(Math.abs))||1:1;
 if(values?.length){values.slice(0,18).forEach((value,i)=>{let bar=v.norms?.length?Math.max(2,Math.abs(value)/max*19):13;svg+=`<rect role="button" tabindex="0" class="glyph" data-key="${key}" data-index="${i}" x="${10+i*(w-23)/Math.min(values.length,18)}" y="${h-10-bar}" width="${Math.max(3,(w-26)/Math.min(values.length,18)-1)}" height="${bar}" rx="1" fill="${v.language_tokens?.[i]?.valid===false?'#a9b6c6':'#5f73b0'}"><title>Recorded index ${v.token_indices?.[i]??i} · hover for provenance/representation</title></rect>`});}
 else if(v.text)svg+=`<text class="tiny" x="10" y="${h-9}">${esc(v.text.slice(0,24))}</text>`;
 else svg+=`<text class="tiny" x="10" y="${h-9}">${v.mapping?'Not recorded':'Not measured'}</text>`;
 }
 if(training)svg+=`<text class="badge" x="10" y="${h+13}">${id==='velocity'?'Trainable output head':['top','wrist','state','instruction'].includes(id)?'Input observation':'Frozen / inference path'}</text>`;
 svg+='</g>';});
 if(training)svg+=`<path class="edge ${a.backward?'active flowing':''}" d="M1400 240H1344"/><text class="badge" x="1220" y="137">loss gradient → head</text>`;
 svg+='</svg>';document.getElementById('diagram').innerHTML=svg;
 document.querySelectorAll('.node').forEach(el=>{const click=()=>send('streamlit:setComponentValue',{value:{stage:el.dataset.stage,nonce:Math.random().toString(36)},dataType:'json'});el.onclick=e=>{if(!e.target.classList.contains('glyph'))click()};el.onkeydown=e=>{if(e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();click();}};});
 document.querySelectorAll('.glyph').forEach(el=>{const show=e=>inspect(el.dataset.key,Number(el.dataset.index),a,e);el.onmouseenter=show;el.onfocus=show;el.onmouseleave=()=>document.getElementById('hover-preview').style.display='none';el.onblur=el.onmouseleave;el.onclick=e=>{e.stopPropagation();pinned=false;show(e);pinned=true;showInspector();pinEvent();document.getElementById('inspector').scrollIntoView({block:'nearest'});};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.onclick(e);}};});
 if(hover&&pinned)showInspector();size();}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('hover-preview').style.display='none';pinned=false;hover=null;document.getElementById('inspector').style.display='none';size();}});
window.addEventListener('resize',size);
window.addEventListener('message',e=>{if(e.data.type==='streamlit:render')draw(e.data.args)});send('streamlit:componentReady',{apiVersion:1});if(window.PIPELINE_PREVIEW)draw(window.PIPELINE_PREVIEW);
</script></html>
