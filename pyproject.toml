# Dependency groups; run the local application with streamlit run app.py.
[dependency-groups]
shell = [
  "torch==2.10.0+cu126",
  "streamlit==1.50.0",
  "Pillow==11.3.0",
  "graphviz==0.21",
]
runtime = [
  { include-group = "shell" },
  "torchvision==0.25.0+cu126",
  "lerobot[smolvla]==0.6.1",
  "transformers==5.4.0",
  "huggingface-hub==1.6.0",
  "safetensors==0.7.0",
  "accelerate==1.14.0",
  "numpy==2.2.6",
]
prepared-extras = ["plotly==6.3.1", "PyYAML==6.0.3"]
development = ["pytest==8.4.2", "ruff==0.14.1"]
tooling = [
  "pip==26.2.1",
  "setuptools==81.0.0",
  "wheel==0.46.3",
  "packaging==25.0",
]
environment = [
  { include-group = "runtime" },
  { include-group = "development" },
  { include-group = "prepared-extras" },
  { include-group = "tooling" },
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = ["integration: opt-in real pretrained inference, requires cached checkpoint"]
